server:
  port: 8082
  address: 0.0.0.0

spring:
  application:
    name: mcp-pedidos

  ai:
    mcp:
      server:
        name: pokes-e-boas-mcp
        version: 1.0.0
        protocol: STREAMABLE
        type: SYNC
        annotation-scanner:
          enabled: true
        streamable-http:
          mcp-endpoint: /mcp
       
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 3

  sql:
    init:
      mode: always

  jpa:
    defer-datasource-initialization: true
